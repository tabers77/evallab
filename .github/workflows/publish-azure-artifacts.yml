  #       run: |
  #         git remote add azure https://az:${{ secrets.AZURE_ARTIFACTS_PAT }}@dev.azure.com/storaenso-data-services/PROJECT/_git/evallab
  #         git push azure --all --force
  #         git push azure --tags --force
