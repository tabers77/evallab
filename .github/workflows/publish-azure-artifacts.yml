name: Publish to Azure Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  # Verify the tag is on master before publishing
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      on_master: ${{ steps.check.outputs.on_master }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git branch -r --contains ${{ github.sha }} | grep -q 'origin/master'; then
            echo "on_master=true" >> $GITHUB_OUTPUT
          else
            echo "on_master=false" >> $GITHUB_OUTPUT
            echo "::warning::Tag is not on master branch. Skipping publish."
          fi

  publish:
    needs: check-branch
    if: needs.check-branch.outputs.on_master == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to Azure Artifacts
        env:
          TWINE_USERNAME: PAT
          TWINE_PASSWORD: ${{ secrets.AZURE_ARTIFACTS_PAT }}
          TWINE_REPOSITORY_URL: https://pkgs.dev.azure.com/storaenso-data-services/Data%20Science%20Products%20and%20Projects/_packaging/python-internal/pypi/upload/
        run: twine upload --verbose dist/*

  # Uncomment to mirror the repo to Azure DevOps Repos
